services:
  postgres:
    image: postgres:16
    container_name: enderchest_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enderchest}
      POSTGRES_USER: ${POSTGRES_USER:-enderchest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - enderchest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:16
    container_name: enderchest_migrate
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enderchest}
      POSTGRES_USER: ${POSTGRES_USER:-enderchest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    command: ["sh", "/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: enderchest_garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-enderchest}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - enderchest_garage_meta:/var/lib/garage/meta
      - enderchest_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  s3-init:
    image: enderchest-app
    pull_policy: never
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-enderchest}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000}
    command: ["node", "/app/scripts/init-s3.mjs"]
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    image: enderchest-app
    pull_policy: never
    container_name: enderchest_bootstrap_admin
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enderchest}
      POSTGRES_USER: ${POSTGRES_USER:-enderchest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
    volumes:
      - ./scripts/bootstrap-admin.js:/app/scripts/bootstrap-admin.js:ro
    command: ["node", "/app/scripts/bootstrap-admin.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    image: enderchest-app
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: enderchest_app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - enderchest_garage_data:/status/storage:ro
      - ${ENDER_BACKUP_ROOT:-../backups}:/status/backups:ro
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enderchest}
      POSTGRES_USER: ${POSTGRES_USER:-enderchest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:3900}
      S3_BUCKET: ${S3_BUCKET:-enderchest}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
      INVITE_DEFAULT_EXPIRES_HOURS: ${INVITE_DEFAULT_EXPIRES_HOURS:-24}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-600000}
      LOGIN_RATE_LIMIT_BLOCK_MS: ${LOGIN_RATE_LIMIT_BLOCK_MS:-900000}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-5}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-1800000}
      REGISTER_RATE_LIMIT_BLOCK_MS: ${REGISTER_RATE_LIMIT_BLOCK_MS:-1800000}
      INVITE_RATE_LIMIT_MAX: ${INVITE_RATE_LIMIT_MAX:-10}
      INVITE_RATE_LIMIT_WINDOW_MS: ${INVITE_RATE_LIMIT_WINDOW_MS:-3600000}
      INVITE_RATE_LIMIT_BLOCK_MS: ${INVITE_RATE_LIMIT_BLOCK_MS:-3600000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-}
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/db/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  enderchest_postgres_data:
  enderchest_garage_meta:
  enderchest_garage_data:
